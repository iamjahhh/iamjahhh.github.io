<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sample Testing Page</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        .container {
            background: white;
            padding: 3rem;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            text-align: center;
            max-width: 400px;
        }

        h1 {
            color: #333;
            margin-bottom: 2rem;
            font-size: 2rem;
        }

        .like-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1.5rem;
        }

        .like-button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 1rem 2rem;
            font-size: 1.2rem;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }

        .like-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.6);
        }

        .like-button:active {
            transform: translateY(0);
        }

        .like-button.liked {
            animation: pulse 0.3s ease;
        }

        @keyframes pulse {
            0% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.1);
            }
            100% {
                transform: scale(1);
            }
        }

        .heart {
            font-size: 1.5rem;
            display: inline-block;
            transition: transform 0.3s ease;
        }

        .like-button:hover .heart {
            transform: scale(1.2);
        }

        .counter {
            font-size: 3rem;
            font-weight: bold;
            color: #667eea;
            min-width: 100px;
        }

        .counter-label {
            color: #666;
            font-size: 1rem;
            margin-top: 0.5rem;
        }

        .reset-button {
            background: transparent;
            color: #999;
            border: 2px solid #ddd;
            padding: 0.5rem 1.5rem;
            font-size: 0.9rem;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 1rem;
        }

        .reset-button:hover {
            border-color: #667eea;
            color: #667eea;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>GitHub.io Testing Page</h1>
        <div class="like-section">
            <div class="counter" id="likeCounter">0</div>
            <div class="counter-label">Likes</div>
            <button class="like-button" id="likeButton">
                <span class="heart">❤️</span>
                <span>Like</span>
            </button>
            <button class="reset-button" id="resetButton">Reset Counter</button>
        </div>
    </div>

    <script>
        // Get elements
        const likeButton = document.getElementById('likeButton');
        const resetButton = document.getElementById('resetButton');
        const likeCounter = document.getElementById('likeCounter');

        // Initialize counter from localStorage or start at 0
        let likes = parseInt(localStorage.getItem('likes')) || 0;
        likeCounter.textContent = likes;

        // Like button click handler
        likeButton.addEventListener('click', function() {
            likes++;
            likeCounter.textContent = likes;
            
            // Save to localStorage
            localStorage.setItem('likes', likes);
            
            // Add animation class
            likeButton.classList.add('liked');
            
            // Remove animation class after animation completes
            setTimeout(() => {
                likeButton.classList.remove('liked');
            }, 300);
        });

        // Reset button click handler
        resetButton.addEventListener('click', function() {
            if (confirm('Are you sure you want to reset the counter?')) {
                likes = 0;
                likeCounter.textContent = likes;
                localStorage.setItem('likes', likes);
            }
        });
    </script>
</body>
</html>
