<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub Testing Page</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #0d1117;
            color: #e6edf3;
        }

        .container {
            background: #161b22;
            padding: 2rem;
            border-radius: 6px;
            border: 1px solid #30363d;
            text-align: center;
            max-width: 500px;
            width: 90%;
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 1rem;
            margin-bottom: 2rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid #21262d;
        }

        .github-logo {
            width: 40px;
            height: 40px;
        }

        h1 {
            color: #e6edf3;
            font-size: 1.5rem;
            font-weight: 600;
        }

        .like-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1.5rem;
            padding: 2rem 0;
        }

        .counter-display {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .counter {
            font-size: 3.5rem;
            font-weight: 600;
            color: #e6edf3;
            font-variant-numeric: tabular-nums;
        }

        .counter-label {
            color: #8b949e;
            font-size: 0.875rem;
            margin-top: 0.5rem;
        }

        .button-group {
            display: flex;
            gap: 1rem;
            margin-top: 1rem;
        }

        .like-button {
            background: #238636;
            color: #ffffff;
            border: 1px solid rgba(240, 246, 252, 0.1);
            padding: 0.75rem 1.5rem;
            font-size: 1rem;
            font-weight: 500;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-family: inherit;
        }

        .like-button:hover {
            background: #2ea043;
            border-color: rgba(240, 246, 252, 0.2);
        }

        .like-button:active {
            background: #2c974b;
            transform: scale(0.98);
        }

        .like-button.liked {
            animation: pulse 0.3s ease;
        }

        @keyframes pulse {
            0%, 100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.05);
            }
        }

        .heart-icon {
            width: 20px;
            height: 20px;
            transition: transform 0.2s ease;
        }

        .like-button:hover .heart-icon {
            transform: scale(1.1);
        }

        .reset-button {
            background: transparent;
            color: #8b949e;
            border: 1px solid #30363d;
            padding: 0.75rem 1.5rem;
            font-size: 1rem;
            font-weight: 500;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: inherit;
        }

        .reset-button:hover {
            background: #21262d;
            border-color: #8b949e;
            color: #e6edf3;
        }

        .reset-button:active {
            transform: scale(0.98);
        }

        .footer {
            margin-top: 2rem;
            padding-top: 1rem;
            border-top: 1px solid #21262d;
            color: #8b949e;
            font-size: 0.75rem;
        }

    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <svg class="github-logo" viewBox="0 0 16 16" fill="#e6edf3" aria-hidden="true">
                <path d="M8 0c4.42 0 8 3.58 8 8a8.013 8.013 0 0 1-5.45 7.59c-.4.08-.55-.17-.55-.38 0-.27.01-1.13.01-2.2 0-.75-.25-1.23-.54-1.48 1.78-.2 3.65-.88 3.65-3.95 0-.88-.31-1.59-.82-2.15.08-.2.36-1.02-.08-2.12 0 0-.67-.22-2.2.82-.64-.18-1.32-.27-2-.27-.68 0-1.36.09-2 .27-1.53-1.03-2.2-.82-2.2-.82-.44 1.1-.16 1.92-.08 2.12-.51.56-.82 1.28-.82 2.15 0 3.06 1.86 3.75 3.64 3.95-.23.2-.44.55-.51 1.07-.46.21-1.61.55-2.33-.66-.15-.24-.6-.83-1.23-.82-.67.01-.27.38.01.53.34.19.73.9.82 1.13.16.45.68 1.31 2.69.94 0 .67.01 1.3.01 1.49 0 .21-.15.45-.55.38A7.995 7.995 0 0 1 0 8c0-4.42 3.58-8 8-8Z"></path>
            </svg>
            <h1>GitHub Testing Page</h1>
        </div>

        <div class="like-section">
            <div class="counter-display">
                <div class="counter" id="likeCounter">0</div>
            </div>
            <div class="counter-label">Total Likes</div>
            
            <div class="button-group">
                <button class="like-button" id="likeButton">
                    <svg class="heart-icon" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
                        <path d="M7.655 14.916v-.001h-.002l-.006-.003-.018-.01a22.066 22.066 0 0 1-3.744-2.584C2.045 10.731 0 8.35 0 5.5 0 2.836 2.086 1 4.25 1 5.797 1 7.153 1.802 8 3.02 8.847 1.802 10.203 1 11.75 1 13.914 1 16 2.836 16 5.5c0 2.85-2.044 5.231-3.886 6.818a22.094 22.094 0 0 1-3.433 2.414 7.152 7.152 0 0 1-.31.17l-.018.01-.008.004a.75.75 0 0 1-.69 0Z"></path>
                    </svg>
                    <span>Like</span>
                </button>
                <button class="reset-button" id="resetButton">
                    <span>Reset</span>
                </button>
            </div>
        </div>

        <div class="footer">
            Powered by GitHub Pages
        </div>
    </div>

    <script>
        // Get elements
        const likeButton = document.getElementById('likeButton');
        const resetButton = document.getElementById('resetButton');
        const likeCounter = document.getElementById('likeCounter');

        // Initialize counter from localStorage
        let likes = parseInt(localStorage.getItem('likes')) || 0;

        // Update display
        likeCounter.textContent = likes;

        // Like button click handler
        likeButton.addEventListener('click', function() {
            likes++;
            
            // Update display
            likeCounter.textContent = likes;
            
            // Save to localStorage
            localStorage.setItem('likes', likes);
            
            // Add animation class
            likeButton.classList.add('liked');
            
            // Remove animation class after animation completes
            setTimeout(() => {
                likeButton.classList.remove('liked');
            }, 300);
        });

        // Reset button click handler
        resetButton.addEventListener('click', function() {
            if (confirm('Are you sure you want to reset the counter?')) {
                likes = 0;
                
                likeCounter.textContent = likes;
                
                localStorage.setItem('likes', likes);
            }
        });
    </script>
</body>
</html>
